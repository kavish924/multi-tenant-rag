version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  exclusions:
    rules:
      # Tests build SQL from catalog names and use fixed test credentials.
      - path: (_test\.go|internal/testutil/)
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kavish924/multi-tenant-rag
